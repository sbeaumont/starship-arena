[project]
name = "starship-arena"
version = "0.1.0"
description = "A recreation of a 1991 Play-By-Mail space combat game."
# 3.10 is the floor because that is what the host offers; every dependency supports it too.
# Development still happens on the latest Python (see .python-version).
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1",
    "jinja2>=3.1",
    # Only the manual is still generated as a PDF; the per-round reports are gone.
    "weasyprint>=63",
    "wtforms>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    # Lets the ASGI API run inside the WSGI app, so one WSGI entry point can serve everything
    # on a WSGI-only host.
    "a2wsgi>=1.10",
]

# Test-only dependencies. httpx2 backs FastAPI's TestClient.
# Install/run with the group, e.g.:  uv sync --group test  /  uv run --group test ...
[dependency-groups]
test = [
    "httpx2",
]

# The project is run from the repository root (flat layout, no src dir), not installed
# as a wheel, so uv only manages the environment and dependencies.
[tool.uv]
package = false
