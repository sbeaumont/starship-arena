<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %} · Starship Arena</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
    {% block css %}{% endblock %}
</head>
<body>
<header class="topbar">
    <a class="brand" href="{{ url_for('overview') }}">STARSHIP ARENA<span>director</span></a>
    <nav>
        <a href="{{ url_for('players') }}" class="{{ 'here' if request.endpoint == 'players' }}">Players</a>
        <span class="sep"></span>
        <a href="{{ url_for('new_game') }}" class="{{ 'here' if request.endpoint == 'new_game' }}">New game</a>
        <a href="{{ url_for('registering') }}" class="{{ 'here' if request.endpoint in ('registering', 'assign') }}">Registering</a>
        <a href="{{ url_for('overview') }}" class="{{ 'here' if request.endpoint == 'overview' }}">Games</a>
        <a href="{{ url_for('processing') }}" class="{{ 'here' if request.endpoint == 'processing' }}">Processing</a>
        <span class="sep"></span>
        <a href="{{ game_ui_url }}/?page=ships" target="_blank" rel="noopener">Ships</a>
        <a href="{{ game_ui_url }}/?page=lore" target="_blank" rel="noopener">Lore</a>
        <a href="{{ url_for('manual_pdf') }}">Manual</a>
    </nav>
    <span class="clock">Server time: {{ server_time }} {{ server_zone }}</span>
</header>
<div class="main">{% block content %}{% endblock %}</div>
<div id="footer">{% block footer %}{% endblock %}</div>
</body>
</html>
