<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- What the game looks like, at the size of a tab: your ship sweeping a scan cone across the
       grid, the course it came in on behind it, and a contact caught in the sweep.

       The cone is what makes this the game and not a chart or a send button - a course alone is
       a rising line with dots on it, and an arrow alone is every navigation icon ever drawn.

       Palette is the map's: amber is your plan, cyan is what you can see, red is a contact. Both
       markers are the arrowhead ObjectInSpace is drawn with, and the cone is wedge().

       Full bleed, because iOS puts its own background behind a transparent icon. Everything sits
       inside the centred circle of 80% diameter a maskable icon may be cropped to. The grid is
       thin enough to vanish at favicon sizes and only appear once there is room. -->
  <defs>
    <radialGradient id="space" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0e1526"/>
      <stop offset="100%" stop-color="#080b12"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#space)"/>

  <g stroke="#16203a" stroke-width="3">
    <path d="M85.3 0V512M170.7 0V512M341.3 0V512M426.7 0V512
             M0 85.3H512M0 170.7H512M0 341.3H512M0 426.7H512"/>
    <path d="M256 0V512M0 256H512" stroke="#26375e"/>
  </g>

  <!-- The sweep, drawn from the ship along its heading. -->
  <path d="M238,336 L189.8,109.1 A 232,232 0 0 1 420.8,193.2 Z"
        fill="#57d8ff" fill-opacity="0.11" stroke="#57d8ff" stroke-opacity="0.42" stroke-width="4"/>

  <!-- Where it came in from: a leg per tick, and the joint you drag. -->
  <path d="M158 426 L202 410 L238 336"
        fill="none" stroke="#ffb454" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="202" cy="410" r="15" fill="#0a0e17" stroke="#57d8ff" stroke-width="7"/>

  <!-- A contact, caught in the sweep and coming the other way. -->
  <polygon points="288.6,195.0 345.0,157.2 356.2,187.9" fill="#ff5d6c"/>

  <!-- The ship. Big enough to still be the subject once this is 32 pixels across. -->
  <polygon points="270.8,245.8 255.1,393.0 188.2,368.6" fill="#ffb454"/>
</svg>
