<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- `viewport-fit=cover` so the map reaches the edges of a notched screen; the bars that sit
         over it pad themselves out of the way with env(safe-area-inset-*). `user-scalable=no`
         because the map does its own zooming and the page has nothing to enlarge. -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e17" />

    <!-- Added to a home screen it runs without a browser around it, which is also what keeps the
         viewport from changing height under a drag. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Starship Arena" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="stylesheet" crossorigin href="./assets/index-DjPSQYio.css">

</html>
